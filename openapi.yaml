openapi: 3.0.3
info:
  title: Cowork Booking Payment API
  version: contract-v1-draft
  description: |
    Provider Payment, consumer Purchase. State proposed (M2 draft).
    Contract text: CONTRACT.md. Rules PMT-R01 to PMT-R20.
    Money is integer satang, currency THB. Times are ISO 8601 with an offset.
    Natural keys instead of an Idempotency-Key header: booking_reference for a
    session, (payment_session_id, attempt) for a refund.
    Errors: {"error": {"code": "...", "message": "..."}}.
    The hosted page's card form body carries no schema constraints on purpose: an invalid or
    missing field answers 303 to /pay/<id> with the flash, never 400.
servers:
  - url: http://payment:8000
    description: Internal URL used by Purchase (PAYMENT_INTERNAL_URL)
  - url: http://localhost:8002
    description: Public URL for the browser (PUBLIC_URL)
tags:
  - name: api
    description: JSON API, bearer PAYMENT_API_TOKEN, Purchase only
  - name: hosted-page
    description: HTML pages for the Member's browser
  - name: operator
    description: HTML page for the Operator, HTTP Basic
  - name: ops
    description: Health and the test clock
paths:
  /payment-sessions:
    post:
      tags: [api]
      operationId: createPaymentSession
      summary: Create the checkout for one held booking (repeat returns the stored session)
      description: |
        Order of checks: token (401), fields (400), repeat by booking_reference
        (200 same amount and currency, 409 other amount), insert (201).
        Rules PMT-R01, PMT-R02, PMT-R03, PMT-R04.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            examples:
              standard:
                value:
                  booking_reference: BK-7KQ2M9
                  amount_satang: 45000
                  currency: THB
                  description: Meeting Room A, 2026-10-07 09:00-10:30
                  success_url: http://localhost:8001/bookings/BK-7KQ2M9/return
                  cancel_url: http://localhost:8001/bookings/BK-7KQ2M9
                  expires_at: '2026-10-05T10:13:00+07:00'
      responses:
        '201':
          description: New session, status open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                created:
                  $ref: '#/components/examples/SessionOpen'
        '200':
          description: Repeat with the same amount and currency; the stored session, unchanged, in any status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                repeat_open:
                  $ref: '#/components/examples/SessionOpen'
                repeat_paid:
                  $ref: '#/components/examples/SessionPaid'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The booking reference already has a session with another amount; nothing changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: session_conflict
                  message: BK-7KQ2M9 already has a payment session for 45000 THB
  /payment-sessions/{id}:
    get:
      tags: [api]
      operationId: getPaymentSession
      summary: Read one session (Purchase reconciles with it)
      description: Rules PMT-R01, PMT-R05, PMT-R10, PMT-R11.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session; status expired once clock.now() reaches expires_at
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                open:
                  $ref: '#/components/examples/SessionOpen'
                paid:
                  $ref: '#/components/examples/SessionPaid'
                expired:
                  $ref: '#/components/examples/SessionExpired'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /payment-sessions/{id}/expire:
    post:
      tags: [api]
      operationId: expirePaymentSession
      summary: Expire an open session and return its final state (a paid session stays paid)
      description: |
        No request body. The expire and a payment attempt lock the same row;
        exactly one wins. A repeat returns the final state. Rules PMT-R01, PMT-R06, PMT-R12.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Final state of the session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                was_open:
                  $ref: '#/components/examples/SessionExpired'
                already_paid:
                  $ref: '#/components/examples/SessionPaid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /refunds:
    post:
      tags: [api]
      operationId: createRefund
      summary: Refund a paid session; the outcome is final in the answer
      description: |
        Order of checks: token (401), fields (400), session (404), reference (409),
        repeat key (payment_session_id, attempt) (200 same amount, 409 other amount),
        balance (409), insert (201). Rules PMT-R01, PMT-R14, PMT-R15, PMT-R16.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundCreate'
            examples:
              member_cancel:
                value:
                  payment_session_id: ps_Q7mZ3xK9vT2bN8rL4wYc1A
                  booking_reference: BK-7KQ2M9
                  amount_satang: 45000
                  reason: member_cancel
                  attempt: 1
              operator_retry:
                value:
                  payment_session_id: ps_R2kW8nT5vQ9mX3bL7yHd4E
                  booking_reference: BK-3HT8WD
                  amount_satang: 100000
                  reason: member_cancel
                  attempt: 2
      responses:
        '201':
          description: New refund; status succeeded or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
              examples:
                succeeded:
                  $ref: '#/components/examples/RefundSucceeded'
                failed_first_refund_card_5126:
                  $ref: '#/components/examples/RefundFailed'
        '200':
          description: Repeat of the same key and amount; the stored refund, even if it failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
              examples:
                repeat:
                  $ref: '#/components/examples/RefundSucceeded'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Reference mismatch, same attempt with another amount, or over the amount collected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                reference_mismatch:
                  value:
                    error:
                      code: reference_mismatch
                      message: booking_reference does not match the session
                refund_conflict:
                  value:
                    error:
                      code: refund_conflict
                      message: refund attempt 1 already exists with a different amount
                refund_exceeds_collected:
                  value:
                    error:
                      code: refund_exceeds_collected
                      message: refund exceeds amount collected
  /pay/{id}:
    get:
      tags: [hosted-page]
      operationId: showHostedPage
      security: []
      summary: Hosted mock checkout page (no login, no token)
      description: |
        open: amount, reference, description, countdown ("Pay by 10:13 (N min left)" with
        data-seconds-left from clock.now(); the script never reads the browser clock), test-mode
        banner, card form, Pay, Back.
        complete: "Paid" and a link to success_url?session_id=<id>.
        expired: "This payment session has expired. Nothing was charged." and "Back to your booking".
        After a decline, the flashed reason inside an element data-decline-code="<code>".
        Rules PMT-R07, PMT-R05, PMT-R10.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The page for the session's current status
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Unknown session; no booking data
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [hosted-page]
      operationId: payOnHostedPage
      security: []
      summary: Submit the card form
      description: |
        Order of checks: unknown id 404; complete 303 to success_url with no attempt; expired or
        at or after expires_at 409; card fields 303 to /pay/<id> with the flashed message ("Card
        number must be 13 to 19 digits", "CVC must be 3 or 4 digits", "Expiry must be MM/YY",
        "The expiry date has passed") and no attempt; then the attempt. Success 303 to
        success_url?session_id=<id>. Decline 303 to /pay/<id>; the attempt is stored and the GET
        shows the flashed reason inside data-decline-code="<code>". The 409 renders the expired
        page: "This payment session has expired. Nothing was charged." and "Back to your booking".
        Only brand and last4 are stored.
        Rules PMT-R08, PMT-R09, PMT-R10, PMT-R11, PMT-R12, PMT-R13.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                card_number:
                  type: string
                  description: 13 to 19 digits after spaces are removed, else "Card number must be 13 to 19 digits"
                  example: '4242424242424242'
                expiry:
                  type: string
                  description: MM/YY with MM 01 to 12, else "Expiry must be MM/YY"; not before the current Bangkok month, else "The expiry date has passed"
                  example: 12/28
                cvc:
                  type: string
                  description: 3 or 4 digits, else "CVC must be 3 or 4 digits"
                  example: '123'
      responses:
        '303':
          description: |
            Success or already complete: Location success_url?session_id=<id>.
            Decline or card-format error: Location /pay/<id>, the reason flashed; the session stays open.
          headers:
            Location:
              schema:
                type: string
              example: http://localhost:8001/bookings/BK-7KQ2M9/return?session_id=ps_Q7mZ3xK9vT2bN8rL4wYc1A
        '404':
          description: Unknown session
          content:
            text/html:
              schema:
                type: string
        '409':
          description: At or after expires_at, or the session is expired; no attempt stored
          content:
            text/html:
              schema:
                type: string
              example: '<p>This payment session has expired. Nothing was charged.</p><a href="http://localhost:8001/bookings/BK-7KQ2M9">Back to your booking</a>'
  /operator:
    get:
      tags: [operator]
      operationId: operatorPage
      summary: Sessions, attempts, refunds, totals and "needs manual follow-up"
      description: |
        HTTP Basic, user "operator", password OPERATOR_PASSWORD. Rule PMT-R17.
        Sessions (booking_reference, amount, status, paid_at), attempts (booking_reference, brand,
        last4, result, decline code, attempted_at), refunds (booking_reference, attempt, amount,
        reason, status, created_at), all-time totals. Order: sessions newest paid_at first, then
        unpaid sessions newest created first; attempts newest attempted_at first; refunds newest
        created_at first. paid_at, attempted_at and created_at are
        business times written from clock.now(), never a database default.
        Markers: data-session-id and data-booking-reference on every session, attempt and refund
        row; data-attempt-result (and data-decline-code on a declined row); data-refund-attempt,
        data-refund-status; data-follow-up="<booking_reference>" with "needs manual follow-up.
        Retry it from Purchase: All bookings" while a failed refund needs follow-up;
        data-collected-satang, data-refunded-satang, data-net-satang, data-commission-satang.
      security:
        - basicAuth: []
      responses:
        '200':
          description: Operator page
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Missing or wrong password; WWW-Authenticate Basic challenge
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Basic realm="operator"
  /health:
    get:
      tags: [ops]
      operationId: health
      security: []
      summary: Liveness with the deployed revision
      responses:
        '200':
          description: Database reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                revision: 3f9c2e1
        '503':
          description: Database unreachable. /health keeps the seed shape, not the standard error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: error
                error: database unreachable
  /_test/clock:
    post:
      tags: [ops]
      operationId: setTestClock
      security: []
      summary: Set or clear the test clock (404 unless TEST_CLOCK_ENABLED=true)
      description: Rule PMT-R20. Never enabled in the Dockerfile, the service compose.yaml or .env.example; only integration/compose.e2e.yaml sets it. The override is a fixed instant that never advances.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Clock'
            examples:
              set:
                value:
                  now: '2026-10-05T10:13:00+07:00'
              clear:
                value:
                  now: null
      responses:
        '200':
          description: Override stored (or cleared with null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clock'
              example:
                now: '2026-10-05T10:13:00+07:00'
        '400':
          description: A now that is not ISO 8601 with an offset; nothing stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: TEST_CLOCK_ENABLED is not exactly "true"; nothing stored. With the flag off, clock.now() never reads test_clock
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer <PAYMENT_API_TOKEN>. Checked before validation; 401 otherwise.'
    basicAuth:
      type: http
      scheme: basic
      description: User "operator", password OPERATOR_PASSWORD (only the password is checked).
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: A session id; any other value gets 404, never 400 (the pattern is on the Session schema)
      schema:
        type: string
      example: ps_Q7mZ3xK9vT2bN8rL4wYc1A
  responses:
    InvalidRequest:
      description: A field is missing, has the wrong type or is out of range; the message names the field; nothing stored
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            amount_below_minimum:
              summary: A request for BK-9MZ4RC with amount_satang 999 (below the schema minimum 1000); nothing stored
              value:
                error:
                  code: invalid_request
                  message: amount_satang must be at least 1000 (THB 10.00)
            naive_expires_at:
              value:
                error:
                  code: invalid_request
                  message: expires_at must be ISO 8601 with an offset
            amount_out_of_range:
              value:
                error:
                  code: invalid_request
                  message: amount_satang is out of range
    Unauthorized:
      description: No token, a wrong token or the wrong scheme; nothing changes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: unauthorized
    NotFound:
      description: Unknown payment session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: payment session not found
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, unauthorized, not_found, session_conflict, refund_conflict, reference_mismatch, refund_exceeds_collected]
            message:
              type: string
    SessionCreate:
      type: object
      required: [booking_reference, amount_satang, currency, description, success_url, cancel_url, expires_at]
      properties:
        booking_reference:
          type: string
          minLength: 1
          example: BK-7KQ2M9
        amount_satang:
          type: integer
          format: int64
          minimum: 1000
          maximum: 9223372036854775807
          example: 45000
        currency:
          type: string
          enum: [THB]
        description:
          type: string
          description: Space name and Bangkok time only; never a name or email
          example: Meeting Room A, 2026-10-07 09:00-10:30
        success_url:
          type: string
          format: uri
          description: Absolute http or https URL; Payment appends ?session_id=<id>
        cancel_url:
          type: string
          format: uri
          description: Absolute http or https URL; the Back link
        expires_at:
          type: string
          format: date-time
          description: ISO 8601 with an offset; after clock.now() for a new session; hold_expires_at minus 2 min
          example: '2026-10-05T10:13:00+07:00'
    Session:
      type: object
      required: [id, url, status, payment_status, amount_satang, currency, booking_reference, expires_at]
      properties:
        id:
          type: string
          pattern: '^ps_[A-Za-z0-9_-]{22}$'
          description: ps_ + secrets.token_urlsafe(16), 128 random bits (PMT-R02)
        url:
          type: string
          format: uri
        status:
          type: string
          enum: [open, complete, expired]
        payment_status:
          type: string
          enum: [unpaid, paid]
        amount_satang:
          type: integer
          format: int64
        currency:
          type: string
          enum: [THB]
        booking_reference:
          type: string
        expires_at:
          type: string
          format: date-time
    RefundCreate:
      type: object
      required: [payment_session_id, booking_reference, amount_satang, reason, attempt]
      properties:
        payment_session_id:
          type: string
          example: ps_Q7mZ3xK9vT2bN8rL4wYc1A
        booking_reference:
          type: string
          description: Must equal the session's booking_reference
          example: BK-7KQ2M9
        amount_satang:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          example: 45000
        reason:
          type: string
          minLength: 1
          description: Purchase sends member_cancel, operator_cancel, amount_mismatch or slot_unavailable
          example: member_cancel
        attempt:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          example: 1
    Refund:
      type: object
      required: [id, payment_session_id, booking_reference, amount_satang, reason, attempt, status]
      properties:
        id:
          type: string
          pattern: '^re_'
        payment_session_id:
          type: string
        booking_reference:
          type: string
        amount_satang:
          type: integer
          format: int64
        reason:
          type: string
        attempt:
          type: integer
        status:
          type: string
          enum: [succeeded, failed]
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
        revision:
          type: string
        error:
          type: string
    Clock:
      type: object
      required: [now]
      properties:
        now:
          type: string
          format: date-time
          nullable: true
  examples:
    SessionOpen:
      value:
        id: ps_Q7mZ3xK9vT2bN8rL4wYc1A
        url: http://localhost:8002/pay/ps_Q7mZ3xK9vT2bN8rL4wYc1A
        status: open
        payment_status: unpaid
        amount_satang: 45000
        currency: THB
        booking_reference: BK-7KQ2M9
        expires_at: '2026-10-05T10:13:00+07:00'
    SessionPaid:
      value:
        id: ps_Q7mZ3xK9vT2bN8rL4wYc1A
        url: http://localhost:8002/pay/ps_Q7mZ3xK9vT2bN8rL4wYc1A
        status: complete
        payment_status: paid
        amount_satang: 45000
        currency: THB
        booking_reference: BK-7KQ2M9
        expires_at: '2026-10-05T10:13:00+07:00'
    SessionExpired:
      value:
        id: ps_Q7mZ3xK9vT2bN8rL4wYc1A
        url: http://localhost:8002/pay/ps_Q7mZ3xK9vT2bN8rL4wYc1A
        status: expired
        payment_status: unpaid
        amount_satang: 45000
        currency: THB
        booking_reference: BK-7KQ2M9
        expires_at: '2026-10-05T10:13:00+07:00'
    RefundSucceeded:
      value:
        id: re_3Jd8Qk2Vn7Xp5Lw9Tz4Hc6
        payment_session_id: ps_Q7mZ3xK9vT2bN8rL4wYc1A
        booking_reference: BK-7KQ2M9
        amount_satang: 45000
        reason: member_cancel
        attempt: 1
        status: succeeded
    RefundFailed:
      value:
        id: re_7Kp2Xw9Qm4Tn8Rv3Lc6Yb5
        payment_session_id: ps_R2kW8nT5vQ9mX3bL7yHd4E
        booking_reference: BK-3HT8WD
        amount_satang: 100000
        reason: member_cancel
        attempt: 1
        status: failed
