name: cowork-booking-payment

services:
  db:
    image: postgres:16
    container_name: cowork-booking-payment-db
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    ports:
      - "5442:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    image: cowork-booking-payment
    container_name: cowork-booking-payment-app
    environment:
      APP_REVISION: compose
      DATABASE_URL: postgresql://payment:payment@db:5432/payment
    ports:
      - "8002:8000"
    depends_on:
      - db

volumes:
  db-data:
